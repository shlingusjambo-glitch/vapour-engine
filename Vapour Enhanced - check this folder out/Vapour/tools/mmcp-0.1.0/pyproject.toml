[project]
name = "mmcp"
version = "0.1.0"
description = "Model Music Context Protocol — let an LLM compose real audio, rendered offline to WAV with metadata it can reason about."
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "mcp>=2"]

[project.scripts]
mmcp = "mmcp.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mmcp"]
include-package-data = true

[tool.setuptools.package-data]
mmcp = ["SPEC.md"]
